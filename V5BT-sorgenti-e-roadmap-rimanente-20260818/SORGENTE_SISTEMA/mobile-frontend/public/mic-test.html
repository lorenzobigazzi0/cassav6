<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test microfono HTTPS LAN</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 760px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.5;
      }
      code {
        background: #f2f2f2;
        padding: 2px 6px;
        border-radius: 4px;
      }
      button {
        font: inherit;
        padding: 10px 14px;
        cursor: pointer;
      }
      .ok { color: #137333; }
      .ko { color: #b3261e; }
      pre {
        white-space: pre-wrap;
        background: #f7f7f7;
        padding: 12px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Test microfono HTTPS LAN</h1>

    <p>URL corrente: <code id="url"></code></p>
    <p>Secure context: <strong id="secure"></strong></p>
    <p>MediaDevices disponibile: <strong id="mediaDevices"></strong></p>

    <button id="testButton" type="button">Testa microfono</button>

    <h2>Risultato</h2>
    <pre id="result">In attesa...</pre>

    <script>
      const urlEl = document.getElementById("url");
      const secureEl = document.getElementById("secure");
      const mediaDevicesEl = document.getElementById("mediaDevices");
      const resultEl = document.getElementById("result");
      const button = document.getElementById("testButton");

      urlEl.textContent = window.location.href;

      const isSecure = window.isSecureContext;
      secureEl.textContent = isSecure ? "Si" : "No";
      secureEl.className = isSecure ? "ok" : "ko";

      const hasMediaDevices = Boolean(navigator.mediaDevices?.getUserMedia);
      mediaDevicesEl.textContent = hasMediaDevices ? "Si" : "No";
      mediaDevicesEl.className = hasMediaDevices ? "ok" : "ko";

      button.addEventListener("click", async () => {
        resultEl.textContent = "Richiesta permesso microfono in corso...";

        try {
          if (!window.isSecureContext) {
            throw new Error("La pagina non e in secure context. Apri con HTTPS trusted.");
          }

          if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error("navigator.mediaDevices.getUserMedia non e disponibile.");
          }

          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const tracks = stream.getAudioTracks();

          resultEl.textContent = [
            "Microfono OK.",
            `Tracce audio: ${tracks.length}`,
            ...tracks.map((track, index) => `#${index + 1}: ${track.label || "(label non disponibile)"}`),
          ].join("\n");

          stream.getTracks().forEach((track) => track.stop());
        } catch (error) {
          resultEl.textContent = `Errore: ${error?.message || error}`;
        }
      });
    </script>
  </body>
</html>
