<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/mobile/favicon.svg" />
    <title>Palmare Advanced</title>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <svg class="svg-filters" aria-hidden="true" focusable="false">
      <filter
        id="liquid-lens"
        x="-20%"
        y="-20%"
        width="140%"
        height="140%"
        color-interpolation-filters="sRGB"
      >
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.007 0.011"
          numOctaves="1"
          seed="2"
          result="noise"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="noise"
          scale="10"
          xChannelSelector="R"
          yChannelSelector="G"
        >
          <animate attributeName="scale" dur="14s" values="8;12;9;11;8" repeatCount="indefinite" />
        </feDisplacementMap>
      </filter>
    </svg>
    <div id="root"></div>
  </body>
</html>
