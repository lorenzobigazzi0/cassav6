[Unit]
Wants=cassav4-fiscal-simulator.service cassav4-automatic-cash-simulator.service
After=cassav4-fiscal-simulator.service cassav4-automatic-cash-simulator.service

[Service]
EnvironmentFile=/etc/cassav4/cassav4.simulated-hardware.env
# Override the test-safe hard stop only for the owner that dispatches fiscal jobs.
Environment=CASSAV4_TEST_DISABLE_REAL_IO=0
Environment=FISCAL_REAL_IO_DISABLED=0
Environment=POS_FISCAL_REAL_IO_DISABLED=0
Environment=AUTOMATIC_CASH_REAL_ENABLED=0
